name: Deploy shop to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["shop/**", ".github/workflows/deploy-shop.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_PROMPTPAY_ID: ${{ vars.PROMPTPAY_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: shop
          command: pages deploy dist --project-name arp-shop --branch main
